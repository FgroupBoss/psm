server:
  port: 18088

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: psm-operation-control
  datasource:
    url: ${PSM_DB_URL:jdbc:mysql://mysql:3306/psm_operation?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${PSM_DB_USER:root}
    password: ${PSM_DB_PASSWORD:YourStrongP@ssw0rd}
  redis:
    host: ${PSM_REDIS_HOST:redis}
    port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:/mapper/**/*.xml

psm:
  realtime-service-url: http://psm-realtime:18087
  risk-service-url: http://psm-risk:18101
  alarm-service-url: http://psm-realtime:18087
  location-service-url: http://psm-realtime:18087
  dual-prevention-service-url: http://psm-risk:18101
  process-safety-service-url: ${PSM_PROCESS_SAFETY_SERVICE_URL:http://psm-process-safety:18111}
  file-service-url: http://psm-identity:18080
  work-permit-service-url: http://127.0.0.1:18088
  hot-work:
    multi-node-approval:
      enabled: ${PSM_HOT_WORK_MULTI_APPROVAL:false}
  height-work:
    enabled: ${PSM_HEIGHT_WORK_ENABLED:false}
    weather-check-enabled: ${PSM_HEIGHT_WORK_WEATHER_CHECK_ENABLED:false}
    weather-manual-review-enabled: ${PSM_HEIGHT_WORK_WEATHER_MANUAL_REVIEW_ENABLED:true}
    rule-version: HEIGHT-WORK-2026.05
    max-valid-days: 7
  confined-space:
    enabled: ${PSM_CONFINED_SPACE_ENABLED:false}
    rule-version: CONFINED-SPACE-2026.05
  lifting:
    enabled: ${PSM_LIFTING_ENABLED:false}
    rule-version: LIFTING-2026.05
  temporary-electric:
    enabled: ${PSM_TEMPORARY_ELECTRIC_ENABLED:false}
    rule-version: TEMP-ELECTRIC-2026.05
  blind-plate:
    enabled: ${PSM_BLIND_PLATE_ENABLED:false}
    rule-version: BLIND-PLATE-2026.05
  excavation:
    enabled: ${PSM_EXCAVATION_ENABLED:false}
    rule-version: EXCAVATION-2026.05
  road-break:
    enabled: ${PSM_ROAD_BREAK_ENABLED:false}
    rule-version: ROAD-BREAK-2026.05
