server:
  port: 18093

spring:
  application:
    name: psm-notification-service
  datasource:
    url: ${PSM_NOTIFICATION_DB_URL:jdbc:mysql://localhost:3306/psm_notification?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${PSM_NOTIFICATION_DB_USER:root}
    password: ${PSM_NOTIFICATION_DB_PASSWORD:root}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
