server:
  port: 18115

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: psm-incident-governance
  datasource:
    url: ${PSM_DB_URL:jdbc:mysql://mysql:3306/psm_incident_governance?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${PSM_DB_USER:root}
    password: ${PSM_DB_PASSWORD:YourStrongP@ssw0rd}
  redis:
    host: ${PSM_REDIS_HOST:redis}
    port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:/mapper/**/*.xml

psm:
  alarm-service-url: http://psm-realtime:18087
  audit-service-url: http://psm-identity:18080
  contractor-service-url: http://psm-operation:18088
  work-permit-service-url: http://psm-operation:18088
  major-hazard-service-url: http://psm-risk:18101
  dual-prevention-service-url: http://psm-risk:18101
  inspection-service-url: http://psm-risk:18101
  location-service-url: http://psm-realtime:18087
  video-service-url: http://psm-realtime:18087
  governance-service-url: http://127.0.0.1:18115
  incident-service-url: http://127.0.0.1:18115
  pha-service-url: http://psm-process-safety:18111
  moc-service-url: http://psm-process-safety:18111
  pssr-service-url: http://psm-process-safety:18111
  barrier-service-url: http://psm-process-safety:18111
