server:
  port: 18086

spring:
  application:
    name: psm-major-hazard-service
  datasource:
    url: ${PSM_MAJOR_HAZARD_DB_URL:jdbc:mysql://localhost:3306/psm_major_hazard?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${PSM_MAJOR_HAZARD_DB_USERNAME:psm}
    password: ${PSM_MAJOR_HAZARD_DB_PASSWORD:psm}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

psm:
  audit-service-url: ${PSM_AUDIT_SERVICE_URL:http://localhost:18094}
  central-audit-enabled: ${PSM_CENTRAL_AUDIT_ENABLED:true}
  alarm-service-url: ${PSM_ALARM_SERVICE_URL:http://localhost:18087}
  blocking-alarm-enabled: ${PSM_BLOCKING_ALARM_ENABLED:true}
