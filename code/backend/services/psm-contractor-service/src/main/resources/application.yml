server:
  port: 18085

spring:
  application:
    name: psm-contractor-service
  datasource:
    url: ${PSM_CONTRACTOR_DB_URL:jdbc:mysql://localhost:3306/psm_contractor?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${PSM_CONTRACTOR_DB_USERNAME:psm}
    password: ${PSM_CONTRACTOR_DB_PASSWORD:psm}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

psm:
  audit-service-url: ${PSM_AUDIT_SERVICE_URL:http://localhost:18094}
  central-audit-enabled: ${PSM_CENTRAL_AUDIT_ENABLED:true}
