server:
  port: 18083

spring:
  application:
    name: psm-master-data-service
  datasource:
    url: ${PSM_MASTER_DATA_DB_URL:jdbc:mysql://localhost:3306/psm_master_data?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${PSM_MASTER_DATA_DB_USERNAME:psm}
    password: ${PSM_MASTER_DATA_DB_PASSWORD:psm}
    driver-class-name: com.mysql.cj.jdbc.Driver
