server:
  port: 18111

spring:
  application:
    name: psm-pha-service
  datasource:
    url: ${PSM_PHA_SERVICE_DB_URL:jdbc:mysql://localhost:3306/psm_pha?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${PSM_PHA_SERVICE_DB_USERNAME:psm}
    password: ${PSM_PHA_SERVICE_DB_PASSWORD:psm}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
