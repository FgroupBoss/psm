server:
  port: 18103

spring:
  application:
    name: psm-location-service
  datasource:
    url: ${PSM_LOCATION_DB_URL:jdbc:mysql://localhost:3306/psm_location?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${PSM_LOCATION_DB_USERNAME:psm}
    password: ${PSM_LOCATION_DB_PASSWORD:psm}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

psm:
  alarm-service-url: ${PSM_ALARM_SERVICE_URL:http://localhost:18087}
  contractor-service-url: ${PSM_CONTRACTOR_SERVICE_URL:http://localhost:18085}
