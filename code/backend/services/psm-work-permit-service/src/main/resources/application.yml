server:
  port: 18088

spring:
  application:
    name: psm-work-permit-service
  datasource:
    url: ${PSM_WORK_PERMIT_DB_URL:jdbc:mysql://localhost:3306/psm_work_permit?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${PSM_WORK_PERMIT_DB_USER:root}
    password: ${PSM_WORK_PERMIT_DB_PASSWORD:root}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

psm:
  audit-service-url: ${PSM_AUDIT_SERVICE_URL:http://localhost:18094}
  central-audit-enabled: ${PSM_CENTRAL_AUDIT_ENABLED:true}
  contractor-service-url: ${PSM_CONTRACTOR_SERVICE_URL:http://localhost:18085}
  alarm-service-url: ${PSM_ALARM_SERVICE_URL:http://localhost:18087}
  dual-prevention-service-url: ${PSM_DUAL_PREVENTION_SERVICE_URL:http://localhost:18101}
  location-service-url: ${PSM_LOCATION_SERVICE_URL:http://localhost:18103}
  area-max-headcount: ${PSM_AREA_MAX_HEADCOUNT:50}
  gas-test-valid-minutes: ${PSM_GAS_TEST_VALID_MINUTES:30}
  notification-service-url: ${PSM_NOTIFICATION_SERVICE_URL:http://localhost:18093}
  central-notification-enabled: ${PSM_CENTRAL_NOTIFICATION_ENABLED:true}
