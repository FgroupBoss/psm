server:
  port: 18104

spring:
  application:
    name: psm-video-service
  datasource:
    url: ${PSM_VIDEO_DB_URL:jdbc:mysql://localhost:3306/psm_video?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${PSM_VIDEO_DB_USERNAME:psm}
    password: ${PSM_VIDEO_DB_PASSWORD:psm}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

psm:
  alarm-service-url: ${PSM_ALARM_SERVICE_URL:http://localhost:18087}
  central-alarm-enabled: ${PSM_CENTRAL_ALARM_ENABLED:true}
  video:
    live-url-pattern: ${PSM_VIDEO_LIVE_URL_PATTERN:https://video.example.com/live/{platformCode}/{cameraCode}?token={token}&expires={expiresAt}}
    playback-url-pattern: ${PSM_VIDEO_PLAYBACK_URL_PATTERN:https://video.example.com/playback/{platformCode}/{cameraCode}?start={startAt}&end={endAt}&token={token}&expires={expiresAt}}
    url-token-ttl-seconds: ${PSM_VIDEO_URL_TOKEN_TTL_SECONDS:300}
    auto-alarm-severities: ${PSM_VIDEO_AUTO_ALARM_SEVERITIES:HIGH,CRITICAL}
    ingest-dedup-minutes: ${PSM_VIDEO_INGEST_DEDUP_MINUTES:5}
