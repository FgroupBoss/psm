server:
  port: 18091

spring:
  application:
    name: psm-integration-service
  datasource:
    url: ${PSM_INTEGRATION_DB_URL:jdbc:mysql://localhost:3306/psm_integration?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${PSM_INTEGRATION_DB_USERNAME:psm}
    password: ${PSM_INTEGRATION_DB_PASSWORD:psm}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

psm:
  dual-prevention-service-url: ${PSM_DUAL_PREVENTION_SERVICE_URL:http://localhost:18101}
  work-permit-service-url: ${PSM_WORK_PERMIT_SERVICE_URL:http://localhost:18088}
  major-hazard-service-url: ${PSM_MAJOR_HAZARD_SERVICE_URL:http://localhost:18086}
  alarm-service-url: ${PSM_ALARM_SERVICE_URL:http://localhost:18087}
