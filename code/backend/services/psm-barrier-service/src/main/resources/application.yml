server:
  port: 18114

spring:
  application:
    name: psm-barrier-service
  datasource:
    url: ${PSM_BARRIER_SERVICE_DB_URL:jdbc:mysql://localhost:3306/psm_barrier?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${PSM_BARRIER_SERVICE_DB_USERNAME:psm}
    password: ${PSM_BARRIER_SERVICE_DB_PASSWORD:psm}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
