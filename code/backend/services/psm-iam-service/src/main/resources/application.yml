server:
  port: 18082

spring:
  application:
    name: psm-iam-service
  datasource:
    url: ${PSM_IAM_DB_URL:jdbc:mysql://localhost:3306/psm_iam?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${PSM_IAM_DB_USERNAME:psm}
    password: ${PSM_IAM_DB_PASSWORD:psm}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

