server:
  port: 18102

spring:
  application:
    name: psm-inspection-service
  datasource:
    url: ${PSM_INSPECTION_DB_URL:jdbc:mysql://localhost:3306/psm_inspection?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${PSM_INSPECTION_DB_USERNAME:psm}
    password: ${PSM_INSPECTION_DB_PASSWORD:psm}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

psm:
  dual-prevention-service-url: ${PSM_DUAL_PREVENTION_SERVICE_URL:http://localhost:18101}
