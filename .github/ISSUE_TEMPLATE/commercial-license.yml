name: 商用授权申请
description: 向 FgroupBoss 申请本仓库的商业使用、企业部署或再许可授权
title: "[商用授权] "
labels:
  - commercial-license
body:
  - type: markdown
    value: |
      本仓库采用[个人学习使用许可证](https://github.com/FgroupBoss/psm/blob/main/LICENSE)：个人学习与非商用实验免费；**商用须事先获得 FgroupBoss 书面授权**。

      请如实填写以下信息，我们将在收到后通过 Issue 评论或邮件 **505822727@qq.com** 与您联系。请勿在 Issue 中公开敏感商业机密或密钥。

  - type: input
    id: contact-name
    attributes:
      label: 联系人姓名
      placeholder: 张三
    validations:
      required: true

  - type: input
    id: contact-email
    attributes:
      label: 联系邮箱
      placeholder: name@company.com
    validations:
      required: true

  - type: input
    id: organization
    attributes:
      label: 公司 / 组织名称
      placeholder: 某某科技有限公司
    validations:
      required: true

  - type: dropdown
    id: use-type
    attributes:
      label: 申请用途类型
      options:
        - 企业内生产 / 运营环境部署
        - 对外 SaaS / 托管服务
        - 项目交付 / 集成到客户产品
        - 二次开发后对外分发 / 再许可
        - 其他（请在下方说明）
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景说明
      description: 请描述业务背景、使用模块（如承包商、危险源、作业票等）及预期目标
      placeholder: 例如：在某化工园区部署承包商准入模块，供 3 家试点企业使用……
    validations:
      required: true

  - type: dropdown
    id: deployment-scope
    attributes:
      label: 部署范围
      options:
        - 单机 / 开发测试环境
        - 单租户生产环境
        - 多租户 SaaS
        - 私有化交付（客户侧部署）
        - 尚未确定
    validations:
      required: true

  - type: input
    id: user-scale
    attributes:
      label: 预计用户 / 租户规模
      placeholder: 例如：约 200 名用户、5 个租户
    validations:
      required: true

  - type: dropdown
    id: duration
    attributes:
      label: 预期使用期限
      options:
        - 6 个月以内（试点）
        - 1 年
        - 1～3 年
        - 长期 / 永久
        - 尚未确定
    validations:
      required: true

  - type: checkboxes
    id: scope-modules
    attributes:
      label: 计划使用的仓库范围（可多选）
      options:
        - label: 后端微服务（code/backend）
        - label: 前端应用（code/frontend）
        - label: 设计文档（design）
        - label: 部署与脚本（code/deploy、code/scripts）
        - label: 全部或大部分内容
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充说明（可选）
      description: 定制需求、集成系统、期望授权形式（独家/非独家）等
      placeholder: 如有特殊集成（SSO、DCS 等）或定制开发需求，请在此说明

  - type: checkboxes
    id: agreement
    attributes:
      label: 确认
      options:
        - label: 我已阅读 LICENSE，理解在未获书面授权前不得将本软件用于商用或组织内生产环境
          required: true
        - label: 我同意 FgroupBoss 就本申请通过 Issue 或邮件与我沟通，所填信息真实有效
          required: true
